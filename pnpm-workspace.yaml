packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  msgpackr-extract: false
  workerd: false
# pnpm 10 (el que usa corepack en Hostinger) no entiende allowBuilds
onlyBuiltDependencies:
  - esbuild
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
